services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: cin0019-ora
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: hosp
      APP_USER_PASSWORD: hosp
    volumes:
      - ./consultas:/consultas:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
